          version: 13.2.4
          spec:
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: same_as_value
              reduceOptions:
                calcs:
                  - lastNotNull
                fields: ""
                values: false
              showPercentChange: false
              textMode: value_and_name
              wideLayout: true
            fieldConfig:
              defaults:
                displayName: Ticks Since Reset
                unit: Ticks
                decimals: 0
                min: 0
                thresholds:
                  mode: percentage
                  steps:
                    - value: 0
                      color: dark-green
                color:
