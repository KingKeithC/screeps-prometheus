                    - value: 50
                      color: "#EAB839"
                    - value: 100
                      color: dark-green
                color:
                  mode: thresholds
              overrides:
                - matcher:
                    id: byFrameRefID
                    options: gcl_progress
                  properties:
                    - id: unit
                      value: percentunit
                    - id: thresholds
                      value:
                        mode: percentage
                        steps:
                          - color: dark-red
                            value: 0
                          - color: yellow
