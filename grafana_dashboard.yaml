    panel-25:
      kind: Panel
      spec:
        id: 25
        title: Hourly Rolling Tickrate
        description: ""
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: prometheus
                    version: v0
                    datasource:
                      name: ${ds}
                    spec:
                      editorMode: builder
                      exemplar: false
                      expr: rate(screeps_time_ticks{job="screeps_prometheus"}[1h])
                      instant: false
                      legendFormat: TPS/1h
                      range: true
                  refId: TickRate
                  hidden: false
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: __expr__
                    version: v0
                    datasource:
                      name: __expr__
                    spec:
                      expression: TickRate
                      reducer: min
                      settings:
                        mode: dropNN
                      type: reduce
                  refId: Best
                  hidden: false
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: __expr__
                    version: v0
                    datasource:
                      name: __expr__
                    spec:
                      expression: TickRate
                      reducer: max
                      settings:
                        mode: dropNN
                      type: reduce
                  refId: Worst
                  hidden: false
            transformations:
              - kind: Transformation
                group: reduce
                spec:
                  disabled: true
                  options:
                    includeTimeField: false
                    labelsToFields: true
                    mode: reduceFields
                    reducers:
                      - max
                      - min
                      - lastNotNull
            queryOptions:
              interval: $_shared_interval
        vizConfig:
          kind: VizConfig
          group: stat
          version: 13.2.4
          spec:
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: vertical
              percentChangeColorMode: inverted
              reduceOptions:
                calcs:
                  - lastNotNull
                fields: ""
                values: false
              showPercentChange: true
              textMode: auto
              wideLayout: true
            fieldConfig:
              defaults:
                thresholds:
                  mode: absolute
                  steps:
                    - value: 0
                      color: green
                    - value: 80
                      color: red
                color:
                  mode: thresholds
                fieldMinMax: false
              overrides:
                - matcher:
                    id: byName
                    scope: series
                    options: >-
                      Best {instance="utilities-container-main",
                      job="screeps_prometheus"}
                  properties:
                    - id: displayName
                      value: Best
                - matcher:
                    id: byName
                    scope: series
                    options: >-
                      Worst {instance="utilities-container-main",
                      job="screeps_prometheus"}
                  properties:
                    - id: displayName
                      value: Worst
        transparent: true
    panel-3:
      kind: Panel
      spec:
        id: 3
